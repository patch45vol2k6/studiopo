<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scriptwise – Writer</title>
  <style>
    :root {
      --ink: #1d1b19;
      --muted: #5c5750;
      --paper: #fbf9f5;
      --surface: #ffffff;
      --line: #e6e1d9;
      --accent: #2f5d50;
      --accent-ink: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --ink: #f3f0ea; --muted: #b7b0a6; --paper: #161513; --surface: #1f1e1b;
        --line: #36332e; --accent: #7fc1ae; --accent-ink: #10201b;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--paper); color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    header {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--surface);
      position: sticky; top: 0; z-index: 5;
    }
    #title-input {
      font-size: 1.05rem; font-weight: 600; border: 1px solid transparent; background: transparent;
      color: var(--ink); padding: 6px 8px; border-radius: 6px; min-width: 140px; flex: 1 1 220px;
    }
    #title-input:hover, #title-input:focus { border-color: var(--line); outline: none; }
    .status { color: var(--muted); font-size: 0.88rem; min-width: 110px; }
    .btn {
      min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1.5px solid var(--line);
      background: transparent; color: var(--ink); font-size: 0.95rem; cursor: pointer;
    }
    .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

    .toolbar {
      display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 16px;
      border-bottom: 1px solid var(--line); background: var(--surface);
    }
    .toolbar button {
      min-width: 38px; min-height: 36px; border-radius: 6px; border: 1px solid var(--line);
      background: var(--paper); color: var(--ink); font-size: 0.95rem; cursor: pointer;
    }
    .toolbar button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

    main { max-width: 820px; margin: 0 auto; padding: 32px 16px 80px; }
    #editor {
      background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
      min-height: 70vh; padding: 48px; font-size: 1.05rem; line-height: 1.7;
      box-shadow: 0 1px 2px rgba(0,0,0,.05);
    }
    #editor:focus { outline: none; }
    #editor:empty::before {
      content: "Start writing your script..."; color: var(--muted); font-style: italic;
    }

    .sl-scene { text-transform: uppercase; color: var(--muted); font-weight: 600; }
    .sl-character { text-align: center; font-weight: 700; text-transform: uppercase; }
    .sl-dialogue { margin-left: 18%; max-width: 70%; }
    .sl-parenthetical { margin-left: 12%; max-width: 60%; font-style: italic; color: var(--muted); }
    .sl-transition { text-align: right; text-transform: uppercase; color: var(--muted); }
    .sl-shot { text-transform: uppercase; font-weight: 600; }
    .hl { background: #ffe999; }
    @media (prefers-color-scheme: dark) { .hl { background: #6b5a1f; } }
    .hotkeys {
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
      padding: 8px 16px; background: var(--paper); border-bottom: 1px solid var(--line);
      color: var(--muted); font-size: 0.82rem;
    }
    .hotkeys .hk { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
    .hotkeys kbd {
      background: var(--surface); border: 1px solid var(--line); border-bottom-width: 2px;
      border-radius: 5px; padding: 2px 6px; font-size: 0.78rem; font-family: inherit;
      color: var(--ink); min-width: 1.6em; text-align: center;
    }
    .msg { color: #b4231f; font-size: 0.88rem; }
    @media (prefers-color-scheme: dark) { .msg { color: #ff9b94; } }
    .visually-hidden {
      position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);
    }
  </style>
</head>
<body>
  <header>
    <a href="../index.html" class="btn ghost" style="min-height:40px;line-height:38px;padding:0 14px;">← Scriptwise</a>
    <label for="title-input" class="visually-hidden">Document title</label>
    <input id="title-input" type="text" placeholder="Untitled script" autocomplete="off">
    <span class="status" id="status" role="status" aria-live="polite">Loading…</span>
    <span class="msg" id="error-msg" role="alert"></span>
    <button class="btn primary" id="save-btn" type="button">Save</button>
  </header>

  <div class="toolbar" role="toolbar" aria-label="Formatting">
    <button type="button" data-cmd="bold" aria-pressed="false" title="Bold"><strong>B</strong></button>
    <button type="button" data-cmd="italic" aria-pressed="false" title="Italic"><em>I</em></button>
    <button type="button" data-cmd="underline" aria-pressed="false" title="Underline"><u>U</u></button>
  </div>

  <div class="hotkeys" aria-label="Keyboard shortcuts">
    <span class="hk"><kbd>F1</kbd>Scene</span>
    <span class="hk"><kbd>F2</kbd>Action</span>
    <span class="hk"><kbd>F3</kbd>Character</span>
    <span class="hk"><kbd>F4</kbd>Dialogue</span>
    <span class="hk"><kbd>F5</kbd>Parenthetical</span>
    <span class="hk"><kbd>F6</kbd>Transition</span>
    <span class="hk"><kbd>F7</kbd>Shot</span>
    <span class="hk"><kbd>F8</kbd>Highlight</span>
    <span class="hk"><kbd>F9</kbd>Export .txt</span>
    <span class="hk"><kbd>F10</kbd>Save</span>
  </div>

  <main>
    <div id="editor" contenteditable="true" aria-label="Script content"></div>
  </main>

  <script>
    (function () {
      var API = 'writer.php'; // same folder, called only with POST

      var titleInput = document.getElementById('title-input');
      var editor = document.getElementById('editor');
      var status = document.getElementById('status');
      var errorMsg = document.getElementById('error-msg');
      var saveBtn = document.getElementById('save-btn');
      var toolbarButtons = document.querySelectorAll('.toolbar button[data-cmd]');

      var saveTimer = null;
      var dirty = false;

      function setStatus(text) { status.textContent = text; }
      function setError(text) { errorMsg.textContent = text || ''; }

      function post(fields) {
        var body = new URLSearchParams(fields);
        return fetch(API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: body.toString()
        }).then(function (res) {
          if (!res.ok) throw new Error('Server returned ' + res.status);
          return res.json();
        });
      }

      function load() {
        setStatus('Loading…');
        post({ action: 'load' }).then(function (data) {
          if (!data.ok) throw new Error(data.error || 'Could not load the document.');
          titleInput.value = data.title || '';
          editor.innerHTML = data.content || '';
          setStatus(data.savedAt ? 'Loaded. Saved ' + formatTime(data.savedAt) : 'Ready. Nothing saved yet.');
        }).catch(function (err) {
          setStatus('Could not load.');
          setError(err.message);
        });
      }

      function save() {
        setStatus('Saving…');
        setError('');
        post({
          action: 'save',
          title: titleInput.value,
          content: editor.innerHTML
        }).then(function (data) {
          if (!data.ok) throw new Error(data.error || 'Could not save the document.');
          dirty = false;
          setStatus('Saved ' + formatTime(data.savedAt));
        }).catch(function (err) {
          setStatus('Not saved.');
          setError(err.message);
        });
      }

      function formatTime(iso) {
        if (!iso) return 'just now';
        var d = new Date(iso);
        if (isNaN(d.getTime())) return 'just now';
        return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }

      function scheduleAutosave() {
        dirty = true;
        setStatus('Unsaved changes…');
        clearTimeout(saveTimer);
        saveTimer = setTimeout(save, 1500);
      }

      editor.addEventListener('input', scheduleAutosave);
      titleInput.addEventListener('input', scheduleAutosave);
      saveBtn.addEventListener('click', function () {
        clearTimeout(saveTimer);
        save();
      });

      // Save before leaving if there are unsaved changes.
      window.addEventListener('beforeunload', function (e) {
        if (dirty) {
          e.preventDefault();
          e.returnValue = '';
        }
      });

      // Formatting toolbar.
      toolbarButtons.forEach(function (btn) {
        btn.addEventListener('click', function () {
          editor.focus();
          document.execCommand(btn.dataset.cmd, false, null);
          updateToolbarState();
          scheduleAutosave();
        });
      });
      function updateToolbarState() {
        toolbarButtons.forEach(function (btn) {
          var active = false;
          try { active = document.queryCommandState(btn.dataset.cmd); } catch (e) {}
          btn.setAttribute('aria-pressed', active ? 'true' : 'false');
        });
      }
      document.addEventListener('selectionchange', function () {
        if (document.activeElement === editor) updateToolbarState();
      });

      // F-key hotkeys: set the current line's format, or run an action.
      // F1 Scene  F2 Action  F3 Character  F4 Dialogue  F5 Parenthetical
      // F6 Transition  F7 Shot  F8 Highlight selection  F9 Export .txt  F10 Save
      var LINE_KEYS = {
        F1: 'sl-scene', F2: 'sl-action', F3: 'sl-character',
        F4: 'sl-dialogue', F5: 'sl-parenthetical', F6: 'sl-transition', F7: 'sl-shot'
      };
      function currentBlock() {
        var node = window.getSelection().anchorNode;
        while (node && node !== editor && node.nodeType !== 1) node = node.parentNode;
        while (node && node.parentNode !== editor && node !== editor) node = node.parentNode;
        return (node && node !== editor) ? node : null;
      }
      editor.addEventListener('keydown', function (e) {
        if (LINE_KEYS[e.key]) {
          e.preventDefault();
          document.execCommand('formatBlock', false, 'p');
          var block = currentBlock();
          if (block) block.className = LINE_KEYS[e.key];
          scheduleAutosave();
        } else if (e.key === 'F8') {
          e.preventDefault();
          document.execCommand('hiliteColor', false, window.getSelection().toString() ? '' : null);
          document.execCommand('styleWithCSS', true, null);
          document.execCommand('backColor', false, '#ffe999');
          scheduleAutosave();
        } else if (e.key === 'F9') {
          e.preventDefault();
          var text = editor.innerText;
          var blob = new Blob([text], { type: 'text/plain' });
          var a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = (titleInput.value || 'script') + '.txt';
          a.click();
          URL.revokeObjectURL(a.href);
        } else if (e.key === 'F10') {
          e.preventDefault();
          clearTimeout(saveTimer);
          save();
        }
      });

      load();
    })();
  </script>
</body>
</html>
